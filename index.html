      function syukyoku() {
        const rankTargets = yonsan === 3
          ? [
              { ten: tenM, kitya: kityaM, el: migizyun },
              { ten: tenS, kitya: kityaS, el: sitazyun },
              { ten: tenH, kitya: kityaH, el: hidarizyun }
            ]
          : [
              { ten: tenM, kitya: kityaM, el: migizyun },
              { ten: tenS, kitya: kityaS, el: sitazyun },
              { ten: tenH, kitya: kityaH, el: hidarizyun },
              { ten: tenU, kitya: kityaU, el: uezyun }
            ];
        [migizyun, sitazyun, hidarizyun, uezyun].forEach((el) => {

        rankTargets
          .slice()
          .sort((a, b) => {

      });
      const radios2 = document.querySelectorAll('input[name="zyu"]');
      radios2.forEach(radio => {

        });
      });
      const radios3 = document.querySelectorAll('input[name="huro"]');
      radios3.forEach(radio => {
        radio.addEventListener("change", (e) => {
          huroor = Number(e.target.value);
          sentaku();
          keisanT();
        });
      });
      settei.addEventListener("click", function () {
        setteiG.classList.remove("off");
        setteiK.classList.remove("off");
      });
      setteiK.addEventListener("click", function () {
        setteiG.classList.add("off");
        setteiK.classList.add("off");
      });
      hensyu.addEventListener("click", function () {
        hensyuG.classList.remove("off");
        hensyuK.classList.remove("off");
        if (yonsan === 3) {
          uehen.classList.add("off");
          migihen.value = tenM;
          hidarihen.value = tenH;
          sitahen.value = tenS;
        } else {
          uehen.classList.remove("off");
          migihen.value = tenM;
          hidarihen.value = tenH;
          sitahen.value = tenS;
          uehen.value = tenU;
        }
      });
      hensyuK.addEventListener("click", function () {
        hensyuG.classList.add("off");
        hensyuK.classList.add("off");
      });
      hensyukettei.addEventListener("click", function () {
        tenM = migihen.value;
        tenH = hidarihen.value;
        tenS = sitahen.value;
        if (yonsan === 4) {
          tenU = uehen.value;
        }
        update();
        hensyuG.classList.add("off");
        hensyuK.classList.add("off");
      });
      ryukyoku.addEventListener("click", function () {
        ryukyokuG.classList.remove("off");
        ryukyokuK.classList.remove("off");
        totyuryu.classList.remove("off");
        huturyu.classList.remove("off");
        huturyukettei.classList.add("off");
        tenpaiM.classList.add("off");
        tenpaiS.classList.add("off");
        tenpaiH.classList.add("off");
        if (yonsan === 4) {
          tenpaiU.classList.add("off");
        }
      });
      ryukyokuK.addEventListener("click", function () {
        ryukyokuG.classList.add("off");
        ryukyokuK.classList.add("off");
      });
      syokiten.addEventListener("change", () => {
        motiten = Number(syokiten.value);
        tenM = motiten;
        tenU = motiten;
        tenH = motiten;
        tenS = motiten;
        if (kaisi === 0) {
          update();
        }
        savedata();
      });
      hituyouten.addEventListener("change", () => {
        agariten = Number(hituyouten.value);
        savedata();
      });
      sw1.addEventListener("click", () => {
        sw1.classList.toggle("on");
        swS1.classList.toggle("on");
        savedata();
        keisanT();
      });
      sw2.addEventListener("click", () => {
        sw2.classList.toggle("on");
        swS2.classList.toggle("on");
        savedata();
        keisanT();
      });
      sw3.addEventListener("click", () => {
        sw3.classList.toggle("on");
        swS3.classList.toggle("on");
        savedata();
      });
      totyuryu.addEventListener("click", () => {
        if (((yonsan <= kyoku && nansyu === 1) || (yonsan <= kyoku / 2 && nansyu === 2)) && (yonsan === 4 ? (tenM >= agariten || tenU >= agariten || tenS >= agariten || tenH >= agariten) : (tenM >= agariten || tenS >= agariten || tenH >= agariten))) {
          syukyoku();
        } else {
          if (oyaTop() && ((yonsan <= kyoku && nansyu === 1) || (yonsan <= kyoku / 2 && nansyu === 2))) {
            syukyoku();
          } else {
            centermu.classList.add("off");
            centerms.classList.add("off");
            saiarea.classList.remove("notclick");
            saiarea.classList.remove("off");
            sai1.classList.remove("off");
            sai2.classList.remove("off");
            saiareaB = 1;
            tokutenKettei.classList.add("off");
            tokutenKetteiK.classList.add("off");
            me1.classList.remove(...saiclasses);
            me2.classList.remove(...saiclasses);
            kesuB();
            riboM.classList.add("off");
            riboU.classList.add("off");
            riboH.classList.add("off");
            riboS.classList.add("off");
            honba += 1;
          }
        }
      });
      huturyu.addEventListener("click", () => {
        huturyu.classList.add("off");
        totyuryu.classList.add("off");
        huturyukettei.classList.remove("off");
        tenpaiM.classList.remove("off");
        tenpaiS.classList.remove("off");
        tenpaiH.classList.remove("off");
        tenpaiM.classList.remove("on");
        tenpaiS.classList.remove("on");
        tenpaiH.classList.remove("on");
        tenpaiMS.classList.remove("on");
        tenpaiSS.classList.remove("on");
        tenpaiHS.classList.remove("on");
        if (yonsan === 4) {
          tenpaiU.classList.remove("off");
          tenpaiUS.classList.remove("on");
          tenpaiU.classList.remove("on");
        }
      });
      huturyukettei.addEventListener("click", () => {
        centermu.classList.add("off");
        centerms.classList.add("off");
        saiarea.classList.remove("notclick");
        saiarea.classList.remove("off");
        sai1.classList.remove("off");
        sai2.classList.remove("off");
        saiareaB = 1;
        tokutenKettei.classList.add("off");
        tokutenKetteiK.classList.add("off");
        me1.classList.remove(...saiclasses);
        me2.classList.remove(...saiclasses);
        kesuB();
        riboM.classList.add("off");
        riboU.classList.add("off");
        riboH.classList.add("off");
        riboS.classList.add("off");
        const tenpaiTargets = [
          { on: tenpaiM.classList.contains("on"), key: "M" },
          ...(yonsan === 4 ? [{ on: tenpaiU.classList.contains("on"), key: "U" }] : []),
          { on: tenpaiH.classList.contains("on"), key: "H" },
          { on: tenpaiS.classList.contains("on"), key: "S" }
        ];
        const tenpaiCount = tenpaiTargets.filter((target) => target.on).length;
        if (tenpaiCount > 0 && tenpaiCount < tenpaiTargets.length) {
          let gain = 0;
          let loss = 0;
          if (tenpaiTargets.length === 3) {
            gain = 1000 * (3 - tenpaiCount);
            loss = 1000 * tenpaiCount;
          } else {
            gain = Math.floor(3000 / tenpaiCount);
            loss = Math.floor(3000 / (tenpaiTargets.length - tenpaiCount));
          }
          tenpaiTargets.forEach((target) => {
            if (target.on) {
              if (target.key === "M") {
                tenM += gain;
              } else if (target.key === "U") {
                tenU += gain;
              } else if (target.key === "H") {
                tenH += gain;
              } else if (target.key === "S") {
                tenS += gain;
              }
            } else {
              if (target.key === "M") {
                tenM -= loss;
              } else if (target.key === "U") {
                tenU -= loss;
              } else if (target.key === "H") {
                tenH -= loss;
              } else if (target.key === "S") {
                tenS -= loss;
              }
            }
          });
          update();
        }
        if ((migi.classList.contains("ton") && tenpaiM.classList.contains("on")) || (ue.classList.contains("ton") && tenpaiU.classList.contains("on")) || (hidari.classList.contains("ton") && tenpaiH.classList.contains("on")) || (sita.classList.contains("ton") && tenpaiS.classList.contains("on"))) {
          honba += 1;
        } else {
          if (((yonsan <= kyoku && nansyu === 1) || (yonsan <= kyoku / 2 && nansyu === 2)) && (yonsan === 4 ? (tenM >= agariten || tenU >= agariten || tenS >= agariten || tenH >= agariten) : (tenM >= agariten || tenS >= agariten || tenH >= agariten))) {
            syukyoku();
          } else {
            if ((yonsan <= kyoku && nansyu === 1) || (yonsan <= kyoku / 2 && nansyu === 2)) {
              if (oyaTop() && ((yonsan <= kyoku && nansyu === 1) || (yonsan <= kyoku / 2 && nansyu === 2))) {
                syukyoku();
              } else {
                honba = 0;
                kyoku += 1;
                nextH(migi);
                nextH(ue);
                nextH(sita);
                nextH(hidari);
              }
            } else {
              honba = 0;
              kyoku += 1;
              nextH(migi);
              nextH(ue);
              nextH(sita);
              nextH(hidari);
            }
          }
        }
      });
      tenpaiM.addEventListener("click", () => {
        tenpaiM.classList.toggle("on");
        tenpaiMS.classList.toggle("on");
      });
      tenpaiU.addEventListener("click", () => {
        tenpaiU.classList.toggle("on");
        tenpaiUS.classList.toggle("on");
      });
      tenpaiS.addEventListener("click", () => {
        tenpaiS.classList.toggle("on");
        tenpaiSS.classList.toggle("on");
      });
      tenpaiH.addEventListener("click", () => {
        tenpaiH.classList.toggle("on");
        tenpaiHS.classList.toggle("on");
      });

      });
